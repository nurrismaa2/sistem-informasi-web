<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Belajar Membuat Komentar di HTML</title>
</head>
<body>

    <!-- 1. Komentar Satu Baris -->
    <!-- Ini adalah judul utama halaman -->
    <h1>Selamat Datang di Website Saya</h1>

    <p>Paragraf ini akan tampil normal di layar browser.</p>

    <!-- 
        2. Komentar Multi-Baris (Lebih dari satu baris)
        Biasanya digunakan untuk menulis penjelasan panjang,
        dokumentasi bagian kode, atau catatan tim developer.
    -->
    <p>Belajar HTML dasar itu mudah dan menyenangkan.</p>

    <!-- 3. Menggunakan Komentar untuk Menonaktifkan Kode Sementara (Debugging) -->
    <!--
    <h2>Bagian Ini Sedang Disembunyikan</h2>
    <p>Kode ini tidak akan dirender oleh browser karena berada di dalam tag komentar.</p>
    -->

</body>
</html>
