<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Text Formatting Singkat</title>
</head>
<body>
    <p><b>Tebal</b> | <strong>Tebal (Penting)</strong></p>
    <p><i>Miring</i> | <em>Miring (Penekanan)</em></p>
    <p><u>Garis Bawah</u> | <del>Coret</del> | <mark>Stabilo</mark></p>
    <p>Subscript: H<sub>2</sub>O | Superscript: X<sup>2</sup></p>
    <p><small>Teks kecil</small> | <ins>Teks sisipan</ins></p>
</body>
</html>
