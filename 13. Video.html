<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menampilkan Video di HTML</title>
</head>
<body>
    <h3>Pemutar Video HTML5</h3>
    <!-- Atribut controls menampilkan tombol play, pause, dan volume -->
    <video width="640" height="360" controls poster="thumbnail.jpg">
        <source src="contoh-video.mp4" type="video/mp4">
        <source src="contoh-video.webm" type="video/webm">
        Browser Anda tidak mendukung pemutaran tag video HTML5.
    </video>
</body>
</html>
